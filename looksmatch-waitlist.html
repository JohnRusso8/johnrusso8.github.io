<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LooksMatch — Coming Soon</title>
  <meta name="description" content="LooksMatch is coming soon. No swiping. Get matched with people in your range who share your interests. Join the waitlist for early access." />
  <meta name="robots" content="noindex, nofollow" />

  <meta property="og:title" content="LooksMatch — Coming Soon" />
  <meta property="og:description" content="No swiping. Get matched with people in your range who share your interests. Join the waitlist for early access." />
  <meta property="og:type" content="website" />

  <link rel="icon" type="image/svg+xml" href="assets/looksmatch-logo.svg" />

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Montserrat:wght@400;500;600;700&display=swap');

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      background: #ffffff;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      color: #1a1a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 64px 20px 48px;
    }

    .logo {
      width: 108px;
      height: 108px;
      margin-bottom: 22px;
    }

    .wordmark {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #1a1a1a;
      margin-bottom: 40px;
    }

    .content {
      max-width: 560px;
      text-align: center;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: clamp(30px, 6vw, 44px);
      line-height: 1.15;
      margin: 0 0 18px;
      color: #111111;
    }

    .subtitle {
      font-size: 16px;
      line-height: 1.6;
      color: #555555;
      font-weight: 500;
      margin: 0 0 34px;
    }

    .cta-label {
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #2563eb;
      margin: 0 0 20px;
    }

    .form-shell {
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
      border-radius: 20px;
      border: 1px solid #ececec;
      background: #fafafa;
      overflow: hidden;
    }

    /*
      ---------------------------------------------------------------------
      TALLY EMBED — replace YOUR_FORM_ID below with your real Tally form ID
      once you've built it (tally.so → your form → Share → Embed → copy the
      form ID out of the embed src, e.g. tally.so/embed/XXXXXX).

      Recommended fields to add in Tally, matching the copy on this page:
        1. Email address        (Email, required)
        2. First name           (Short text, required)
        3. City or ZIP code     (Short text, required)
        4. iPhone or Android    (Multiple choice: iPhone / Android / Not sure)
        5. Interested in dating men, women, or everyone? (Multiple choice,
           optional)
        6. Checkbox: "Email me about early access and the LooksMatch
           launch."

      Once you have the form ID, just swap it into the iframe src below —
      no other changes needed, the styling around it already matches.
      ---------------------------------------------------------------------
    */
    iframe#tally-embed {
      width: 100%;
      height: 560px;
      border: none;
    }

    .footer-note {
      margin-top: 28px;
      font-size: 12px;
      color: #a8a8a8;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <img class="logo" src="assets/looksmatch-logo.svg" alt="LooksMatch logo" />
  <div class="wordmark">LooksMatch</div>

  <div class="content">
    <h1>LooksMatch is coming soon</h1>
    <p class="subtitle">
      No swiping. Get matched with people in your range who share your interests.
    </p>
    <p class="cta-label">Join the waitlist for early access</p>

    <div class="form-shell">
      <iframe
        id="tally-embed"
        data-tally-src="https://tally.so/embed/yPbg90?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1"
        title="LooksMatch waitlist"
      ></iframe>
    </div>

    <p class="footer-note">We'll only email you about LooksMatch early access.</p>
  </div>

  <script src="https://tally.so/widgets/embed.js"></script>
  <script>
    // Tally's loader swaps data-tally-src into the iframe's real src once
    // the widget script is ready — standard Tally embed pattern, works as
    // soon as YOUR_FORM_ID above is replaced with a real form ID.
    (function loadTally() {
      if (typeof Tally !== 'undefined') {
        Tally.loadEmbeds();
      } else {
        document.querySelectorAll('iframe[data-tally-src]').forEach((el) => {
          el.src = el.dataset.tallySrc;
        });
      }
    })();
  </script>
</body>
</html>
